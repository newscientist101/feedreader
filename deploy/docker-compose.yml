# Docker Compose deployment for feedreader with Caddy + Authelia (WebAuthn/passkey auth).
#
# Prerequisites:
#   1. Copy .env.example to .env and set DOMAIN.
#   2. Populate authelia/users_database.yml with your user.
#   3. Generate an authelia/configuration.yml jwt_secret and session secret.
#   See DEPLOY.md for the full setup walkthrough.
#
# Start:
#   docker compose up -d
#
# Upgrade:
#   docker compose pull && docker compose up -d
#
# Image: published to Google Artifact Registry by .github/workflows/google.yml.
# The deployment tracks the moving :main tag by default. Override the registry
# path or tag via the FEEDREADER_IMAGE / IMAGE_TAG variables in .env (see
# .env.example) — useful for testing a branch image or a pinned SHA tag.

services:
  caddy:
    # Defaults to the public Docker Hub image. The GCE IPv6-only mode
    # (deploy/gce, no external IPv4) overrides CADDY_IMAGE with a copy
    # mirrored into Artifact Registry, reachable via Private Google Access.
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      - feedreader
      - authelia
    restart: unless-stopped

  authelia:
    image: ${AUTHELIA_IMAGE:-authelia/authelia:latest}
    volumes:
      - ./authelia:/config:ro
      - authelia_data:/data
    expose:
      - "9091"
    restart: unless-stopped

  feedreader:
    image: ${FEEDREADER_IMAGE:-us-central1-docker.pkg.dev/feedreader-489315/my-repo/feedreader}:${IMAGE_TAG:-main}
    volumes:
      - feedreader_data:/data
    environment:
      AUTH_PROVIDER: authelia
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  authelia_data:
  feedreader_data:
